name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hiraku-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + Pagefind)
        id: build
        run: |
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          DURATION=$((END - START))
          PAGE_COUNT=$(find dist -name "*.html" | wc -l | tr -d ' ')
          DIST_SIZE_KB=$(du -sk dist | cut -f1)
          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          echo "page_count=$PAGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "dist_size_kb=$DIST_SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "## Build metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "- Pages: ${PAGE_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- dist size: ${DIST_SIZE_KB} KB" >> $GITHUB_STEP_SUMMARY

      - name: Verify local learning data and retired account APIs
        run: npm run test:local

      - name: Compute single-line commit subject (ASCII-safe)
        id: subject
        run: |
          # First line of commit message, ASCII-only (Cloudflare API rejects non-ASCII)
          SUBJECT=$(git log -1 --pretty=%s)
          # Strip non-ASCII chars to satisfy Cloudflare API
          SAFE=$(printf '%s' "$SUBJECT" | LC_ALL=C tr -cd 'A-Za-z0-9 _.,:;@/()+\-' | head -c 120)
          # Fallback if everything got stripped
          if [ -z "$SAFE" ]; then SAFE="commit ${GITHUB_SHA::8}"; fi
          echo "value=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.2'
          command: pages deploy dist --project-name=hiraku --branch=main --commit-message="${{ steps.subject.outputs.value }}" --commit-hash="${{ github.sha }}"
